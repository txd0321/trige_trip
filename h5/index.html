<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trige Trip</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      height: 44px;
      border-radius: 999px;
      border: none;
      background: #ff7a23;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">打开 Trige Trip</div>
    <div class="subtitle">请在微信内打开本页面，以便跳转到卡牌详情</div>

    <wx-open-launch-weapp id="launch-btn" appid="wx097a679c9efff979" path="">
      <script type="text/wxtag-template">
        <button class="btn">打开小程序</button>
      </script>
    </wx-open-launch-weapp>

    <div class="hint" id="fallback-hint">若按钮不可用，请复制链接在微信中打开。</div>
  </div>

  <script>
    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    const cardId = getQueryParam('cardId') || '';
    const launchBtn = document.getElementById('launch-btn');
    const path = cardId ? `/pages/card/detail?cardId=${encodeURIComponent(cardId)}` : '/pages/card/detail';

    if (launchBtn) {
      launchBtn.setAttribute('path', path);
    }

    const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
    if (isWeChat) {
      document.getElementById('fallback-hint').textContent = '若未自动跳转，请点击按钮打开小程序。';
    }
  </script>
</body>
</html>
